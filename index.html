<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Excretory Wheel</title>
<meta name="description" content="A letter-wheel quiz about the excretory system for Year 5.">
<meta name="theme-color" content="#0f2f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Excretory Wheel">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">

  <div class="top">
    <header>
      <h1>The Excretory Wheel</h1>
      <div class="offline" id="offline" data-state="wait" role="status">Getting ready for offline…</div>
    </header>

    <div class="settings">
      <div class="seg" role="group" aria-label="Timer">
        <button id="t-120" type="button" data-timer="120" aria-pressed="true">2 min</button>
        <button id="t-180" type="button" data-timer="180" aria-pressed="false">3 min</button>
        <button id="t-0" type="button" data-timer="0" aria-pressed="false">No timer</button>
      </div>
      <div class="toggles">
        <button class="ghost" id="snd" type="button" aria-pressed="true">Sound: on</button>
        <button class="ghost" id="voice" type="button" aria-pressed="false">Read aloud: off</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="wheel" id="wheel" aria-label="Wheel of 8 letters">
      <div class="center">
        <div class="num" id="hits">0</div>
        <div class="lbl">correct</div>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="clock" id="clock">
      <div class="time" id="time" role="timer" aria-label="Time left">2:00</div>
      <div class="bar" id="barwrap" aria-hidden="true"><i id="bar"></i></div>
      <button class="b-go" id="go" type="button">Start</button>
    </div>

    <section class="card" id="play">
      <div class="cardhead">
        <p class="starts" id="starts"></p>
        <button class="ghost" id="read" type="button">Listen again</button>
      </div>
      <p class="clue" id="clue"></p>
      <div class="answer" id="answer-row">
        <span id="answer" class="hidden">Answer hidden</span>
        <button class="ghost" id="toggle" type="button">Show answer</button>
      </div>
      <div class="verdicts">
        <button class="b-hit" id="btn-hit" type="button">Correct</button>
        <button class="b-miss" id="btn-miss" type="button">Wrong</button>
        <button class="b-pass" id="btn-pass" type="button">Pass</button>
      </div>
    </section>

    <section class="card final" id="final" hidden>
      <h2 id="final-title"></h2>
      <p class="score" id="final-score"></p>
      <ul class="review" id="review"></ul>
      <button class="b-again" id="again" type="button">Play again</button>
    </section>

    <div class="foot">
      <p class="tally" id="tally" aria-live="polite"></p>
      <div class="btns">
        <button class="ghost" id="undo" type="button">Undo</button>
        <button class="ghost" id="new" type="button">New wheel</button>
      </div>
    </div>
  </div>

</main>
<script src="./words.js"></script>
<script src="./app.js"></script>
</body>
</html>
